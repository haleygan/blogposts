<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis { stroke: #666666; stroke-width: 1.5; }
      .grid { stroke: #334455; stroke-width: 0.5; }
      .axis-label { fill: #b3d9ff; font-size: 12px; font-family: monospace; }
      .curve-linear { stroke: #66cc66; stroke-width: 2.5; fill: none; }
      .curve-nlogn { stroke: #4da6ff; stroke-width: 2.5; fill: none; }
      .curve-quadratic { stroke: #ff6666; stroke-width: 2.5; fill: none; }
      .legend-text { font-size: 11px; font-family: monospace; }
      .title-text { font-size: 16px; font-family: sans-serif; font-weight: bold; fill: #e6e6e6; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#0e1b2f"/>

  <!-- Title -->
  <text x="450" y="30" class="title-text" text-anchor="middle">Complexity Classes: How Work Grows with Input Size</text>

  <!-- Legend -->
  <g id="legend">
    <rect x="620" y="60" width="260" height="110" fill="none" stroke="#4da6ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

    <line x1="635" y1="80" x2="670" y2="80" class="curve-linear"/>
    <text x="685" y="84" class="legend-text" fill="#66cc66">O(n) - Linear</text>

    <line x1="635" y1="105" x2="670" y2="105" class="curve-nlogn"/>
    <text x="685" y="109" class="legend-text" fill="#4da6ff">O(n log n) - Sorting</text>

    <line x1="635" y1="130" x2="670" y2="130" class="curve-quadratic"/>
    <text x="685" y="134" class="legend-text" fill="#ff6666">O(n²) - Quadratic</text>

    <text x="635" y="155" class="legend-text" fill="#99cc99" style="font-size: 10px;">Part 4   Part 5   Part 6</text>
  </g>

  <!-- Axes -->
  <line x1="80" y1="420" x2="600" y2="420" class="axis"/>
  <line x1="80" y1="420" x2="80" y2="50" class="axis"/>

  <!-- Grid lines -->
  <line x1="80" y1="370" x2="600" y2="370" class="grid"/>
  <line x1="80" y1="320" x2="600" y2="320" class="grid"/>
  <line x1="80" y1="270" x2="600" y2="270" class="grid"/>
  <line x1="80" y1="220" x2="600" y2="220" class="grid"/>
  <line x1="80" y1="170" x2="600" y2="170" class="grid"/>
  <line x1="80" y1="120" x2="600" y2="120" class="grid"/>

  <line x1="160" y1="420" x2="160" y2="50" class="grid"/>
  <line x1="240" y1="420" x2="240" y2="50" class="grid"/>
  <line x1="320" y1="420" x2="320" y2="50" class="grid"/>
  <line x1="400" y1="420" x2="400" y2="50" class="grid"/>
  <line x1="480" y1="420" x2="480" y2="50" class="grid"/>
  <line x1="560" y1="420" x2="560" y2="50" class="grid"/>

  <!-- Axis labels - X axis (input size) -->
  <text x="80" y="445" class="axis-label" text-anchor="middle">100</text>
  <text x="160" y="445" class="axis-label" text-anchor="middle">1K</text>
  <text x="240" y="445" class="axis-label" text-anchor="middle">10K</text>
  <text x="320" y="445" class="axis-label" text-anchor="middle">100K</text>
  <text x="400" y="445" class="axis-label" text-anchor="middle">1M</text>
  <text x="480" y="445" class="axis-label" text-anchor="middle">10M</text>
  <text x="560" y="445" class="axis-label" text-anchor="middle">100M</text>

  <!-- Axis label - X -->
  <text x="330" y="475" class="axis-label" style="font-size: 13px; font-weight: bold;" text-anchor="middle">Input Size (n)</text>

  <!-- Axis labels - Y axis (operations) -->
  <text x="65" y="425" class="axis-label" text-anchor="end">0</text>
  <text x="65" y="375" class="axis-label" text-anchor="end">100M</text>
  <text x="65" y="325" class="axis-label" text-anchor="end">200M</text>
  <text x="65" y="275" class="axis-label" text-anchor="end">300M</text>
  <text x="65" y="225" class="axis-label" text-anchor="end">400M</text>
  <text x="65" y="175" class="axis-label" text-anchor="end">500M</text>
  <text x="65" y="125" class="axis-label" text-anchor="end">600M</text>
  <text x="65" y="75" class="axis-label" text-anchor="end">700M</text>

  <!-- Axis label - Y -->
  <text x="20" y="240" class="axis-label" style="font-size: 13px; font-weight: bold;" text-anchor="middle" transform="rotate(-90 20 240)">Operations</text>

  <!-- Curves -->
  <!-- O(n): 100, 1000, 10000, 100000, 1000000, 10000000, 100000000 -->
  <polyline points="80,410 160,393 240,376 320,359 400,342 480,325 560,308" class="curve-linear"/>

  <!-- O(n log n): 660, 9900, 133000, 1660000, 19900000, 233000000, 2650000000 (clamped) -->
  <polyline points="80,404 160,385 240,362 320,328 400,275 480,145 560,50" class="curve-nlogn"/>

  <!-- O(n²): 10000, 1000000, 100000000, clamped for visualization -->
  <polyline points="80,410 160,395 240,368 320,310 400,155 480,50 560,50" class="curve-quadratic"/>

  <!-- Annotations -->
  <text x="420" y="175" style="font-size: 11px; font-family: monospace; fill: #99cc99; font-weight: bold;">At n = 1M:</text>
  <text x="420" y="193" style="font-size: 10px; font-family: monospace; fill: #99cc99;">O(n): 1M ops</text>
  <text x="420" y="208" style="font-size: 10px; font-family: monospace; fill: #99cc99;">O(n log n): 20M ops</text>
  <text x="420" y="223" style="font-size: 10px; font-family: monospace; fill: #99cc99;">O(n²): 1 trillion ops</text>

  <text x="420" y="260" style="font-size: 10px; font-family: monospace; fill: #b3d9ff;">Sorting sits between linear</text>
  <text x="420" y="275" style="font-size: 10px; font-family: monospace; fill: #b3d9ff;">and quadratic, much closer</text>
  <text x="420" y="290" style="font-size: 10px; font-family: monospace; fill: #b3d9ff;">to linear on smaller inputs,</text>
  <text x="420" y="305" style="font-size: 10px; font-family: monospace; fill: #b3d9ff;">but grows logarithmically</text>
</svg>