<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .branch-node { fill: #4da6ff; }
      .leaf-node { fill: #66cc66; }
      .node-text { fill: white; font-size: 11px; font-family: monospace; text-anchor: middle; font-weight: bold; }
      .line { stroke: #666666; stroke-width: 1; }
      .label { fill: #b3d9ff; font-size: 10px; font-family: monospace; }
      .title-text { font-size: 16px; font-family: sans-serif; font-weight: bold; fill: #e6e6e6; }
      .annotation { fill: #99cc99; font-size: 11px; font-family: monospace; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#0e1b2f"/>

  <!-- Title -->
  <text x="450" y="30" class="title-text" text-anchor="middle">Decision Tree for Sorting (Simplified Example: n=3)</text>

  <!-- Level 0: Root -->
  <circle cx="450" cy="70" r="18" class="branch-node"/>
  <text x="450" y="75" class="node-text" style="font-size: 9px;">A&lt;B?</text>

  <!-- Level 1: Left and right branches -->
  <line x1="438" y1="85" x2="300" y2="120" class="line"/>
  <line x1="462" y1="85" x2="600" y2="120" class="line"/>

  <circle cx="300" cy="140" r="18" class="branch-node"/>
  <text x="300" y="145" class="node-text" style="font-size: 9px;">B&lt;C?</text>
  <text x="260" y="110" class="label">yes</text>

  <circle cx="600" cy="140" r="18" class="branch-node"/>
  <text x="600" y="145" class="node-text" style="font-size: 9px;">B&lt;C?</text>
  <text x="630" y="110" class="label">no</text>

  <!-- Level 2: Left subtree outcomes -->
  <line x1="288" y1="155" x2="200" y2="190" class="line"/>
  <line x1="312" y1="155" x2="350" y2="190" class="line"/>

  <circle cx="200" cy="210" r="16" class="branch-node"/>
  <text x="200" y="214" class="node-text" style="font-size: 8px;">A&lt;C?</text>

  <circle cx="350" cy="210" r="16" class="leaf-node"/>
  <text x="350" y="217" class="node-text" style="font-size: 8px;">B,C,A</text>

  <!-- Level 2: Right subtree outcomes -->
  <line x1="588" y1="155" x2="500" y2="190" class="line"/>
  <line x1="612" y1="155" x2="700" y2="190" class="line"/>

  <circle cx="500" cy="210" r="16" class="leaf-node"/>
  <text x="500" y="217" class="node-text" style="font-size: 8px;">A,B,C</text>

  <circle cx="700" cy="210" r="16" class="branch-node"/>
  <text x="700" y="214" class="node-text" style="font-size: 8px;">A&lt;C?</text>

  <!-- Level 3: Leaf nodes from left subtree -->
  <line x1="188" y1="225" x2="130" y2="260" class="line"/>
  <line x1="212" y1="225" x2="220" y2="260" class="line"/>

  <circle cx="130" cy="280" r="14" class="leaf-node"/>
  <text x="130" y="284" class="node-text" style="font-size: 7px;">A,B,C</text>

  <circle cx="220" cy="280" r="14" class="leaf-node"/>
  <text x="220" y="284" class="node-text" style="font-size: 7px;">C,A,B</text>

  <!-- Level 3: Leaf nodes from right subtree -->
  <line x1="688" y1="225" x2="630" y2="260" class="line"/>
  <line x1="712" y1="225" x2="770" y2="260" class="line"/>

  <circle cx="630" cy="280" r="14" class="leaf-node"/>
  <text x="630" y="284" class="node-text" style="font-size: 7px;">C,A,B</text>

  <circle cx="770" cy="280" r="14" class="leaf-node"/>
  <text x="770" y="284" class="node-text" style="font-size: 7px;">C,B,A</text>

  <!-- Theory box -->
  <rect x="50" y="340" width="800" height="190" fill="none" stroke="#4da6ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <text x="70" y="365" class="annotation">Why This Proves O(n log n)</text>

  <text x="70" y="390" style="font-size: 11px; font-family: monospace; fill: #b3d9ff;">For n=3: There are 3! = 6 possible orderings</text>
  <text x="70" y="408" style="font-size: 11px; font-family: monospace; fill: #b3d9ff;">The tree above shows only 5 leaves (one outcome missing for brevity)</text>
  <text x="70" y="426" style="font-size: 11px; font-family: monospace; fill: #b3d9ff;">In reality, a complete decision tree would have 6 leaves</text>
  <text x="70" y="444" style="font-size: 11px; font-family: monospace; fill: #b3d9ff;">The depth of the tree must be at least log2(6) = 2.58 comparisons</text>

  <text x="70" y="468" style="font-size: 11px; font-family: monospace; fill: #99cc99;">For general n:</text>
  <text x="70" y="486" style="font-size: 11px; font-family: monospace; fill: #99cc99;">n! possible orderings require depth >= log2(n!) ≈ n log n</text>
  <text x="70" y="504" style="font-size: 11px; font-family: monospace; fill: #99cc99;">Thus any comparison-based sort needs at least n log n comparisons</text>
</svg>