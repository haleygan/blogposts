<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#0e1b2f"/>

  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" fill="#e8eef7" text-anchor="middle">Call Stack Growth During Recursion</text>

  <!-- Left column: Degenerate (sorted data) -->
  <text x="250" y="90" font-size="18" font-weight="bold" fill="#ff6b6b" text-anchor="middle">Sorted Data: O(n) Stack Space</text>

  <!-- Stack visualization - degenerate -->
  <g id="degenerate-stack">
    <!-- Base -->
    <rect x="150" y="150" width="200" height="40" fill="#ff6b6b" stroke="#ffb3b3" stroke-width="2"/>
    <text x="250" y="178" font-size="12" fill="white" text-anchor="middle" font-weight="bold">frame 1: quicksort([1,2,3,4,5])</text>

    <!-- Frame 2 -->
    <rect x="150" y="115" width="200" height="40" fill="#ff8787" stroke="#ffb3b3" stroke-width="2"/>
    <text x="250" y="143" font-size="12" fill="white" text-anchor="middle" font-weight="bold">frame 2: quicksort([1,2,3,4])</text>

    <!-- Frame 3 -->
    <rect x="150" y="80" width="200" height="40" fill="#ff9999" stroke="#ffb3b3" stroke-width="2"/>
    <text x="250" y="108" font-size="12" fill="white" text-anchor="middle" font-weight="bold">frame 3: quicksort([1,2,3])</text>

    <!-- Frame 4 -->
    <rect x="150" y="45" width="200" height="40" fill="#ffaaaa" stroke="#ffb3b3" stroke-width="2"/>
    <text x="250" y="73" font-size="11" fill="white" text-anchor="middle" font-weight="bold">frame 4: quicksort([1,2])</text>

    <!-- Arrow showing stack depth -->
    <line x1="380" y1="50" x2="430" y2="50" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrowhead-red)"/>
    <line x1="430" y1="50" x2="430" y2="190" stroke="#ff6b6b" stroke-width="2"/>
    <line x1="430" y1="190" x2="380" y2="190" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrowhead-red)"/>
    <text x="470" y="125" font-size="13" fill="#ff6b6b" font-weight="bold">n frames</text>
    <text x="470" y="145" font-size="12" fill="#ff9999">O(n) space</text>
  </g>

  <!-- Right column: Balanced (random data) -->
  <text x="950" y="90" font-size="18" font-weight="bold" fill="#51cf66" text-anchor="middle">Random Data: O(log n) Stack Space</text>

  <!-- Stack visualization - balanced -->
  <g id="balanced-stack">
    <!-- Frame 1 (stays) -->
    <rect x="850" y="150" width="200" height="40" fill="#51cf66" stroke="#a3e9a4" stroke-width="2"/>
    <text x="950" y="178" font-size="12" fill="white" text-anchor="middle" font-weight="bold">frame 1: quicksort([1-8])</text>

    <!-- Frame 2a (pops, then 2b) -->
    <rect x="850" y="115" width="200" height="40" fill="#69db7c" stroke="#a3e9a4" stroke-width="2"/>
    <text x="950" y="143" font-size="11" fill="white" text-anchor="middle" font-weight="bold">frame 2: quicksort([4-8])</text>

    <!-- Frame 3a (pops) -->
    <rect x="850" y="80" width="200" height="40" fill="#7ee8b7" stroke="#a3e9a4" stroke-width="2"/>
    <text x="950" y="108" font-size="10" fill="white" text-anchor="middle" font-weight="bold">frame 3: base case</text>

    <!-- Arrow showing stack depth -->
    <line x1="1080" y1="85" x2="1130" y2="85" stroke="#51cf66" stroke-width="2" marker-end="url(#arrowhead-green)"/>
    <line x1="1130" y1="85" x2="1130" y2="190" stroke="#51cf66" stroke-width="2"/>
    <line x1="1130" y1="190" x2="1080" y2="190" stroke="#51cf66" stroke-width="2" marker-end="url(#arrowhead-green)"/>
    <text x="1170" y="145" font-size="13" fill="#51cf66" font-weight="bold">log n frames</text>
    <text x="1170" y="165" font-size="12" fill="#7ee8b7">O(log n) space</text>
  </g>

  <!-- Divider line -->
  <line x1="600" y1="80" x2="600" y2="220" stroke="#3d5a80" stroke-width="2"/>

  <!-- Bottom: Timeline comparison -->
  <text x="600" y="280" font-size="16" font-weight="bold" fill="#e8eef7" text-anchor="middle">Stack Growth Timeline</text>

  <!-- Degenerate timeline -->
  <text x="250" y="330" font-size="13" fill="#ff6b6b" font-weight="bold">Degenerate (Sorted Data):</text>
  <text x="250" y="360" font-size="12" fill="#a8b8d8">At n=10: 10 simultaneous frames</text>
  <text x="250" y="385" font-size="12" fill="#a8b8d8">At n=100: 100 simultaneous frames</text>
  <text x="250" y="410" font-size="12" fill="#a8b8d8">At n=1,000: hits Python recursion limit</text>
  <text x="250" y="435" font-size="11" fill="#ff9999" font-weight="bold">RecursionError!</text>

  <!-- Balanced timeline -->
  <text x="950" y="330" font-size="13" fill="#51cf66" font-weight="bold">Balanced (Random Data):</text>
  <text x="950" y="360" font-size="12" fill="#a8b8d8">At n=10: 4 simultaneous frames</text>
  <text x="950" y="385" font-size="12" fill="#a8b8d8">At n=100: 7 simultaneous frames</text>
  <text x="950" y="410" font-size="12" fill="#a8b8d8">At n=1,000: 10 simultaneous frames</text>
  <text x="950" y="435" font-size="11" fill="#51cf66" font-weight="bold">Always safe</text>

  <!-- Key insight box -->
  <rect x="80" y="490" width="1040" height="180" fill="#1a2a47" stroke="#3d5a80" stroke-width="2" rx="6"/>
  <text x="600" y="520" font-size="14" font-weight="bold" fill="#7dd3fc" text-anchor="middle">Key Insight: Same Root Cause, Two Symptoms</text>
  <text x="600" y="550" font-size="13" fill="#a8b8d8" text-anchor="middle">Sorted data with naive quicksort triggers:</text>
  <text x="600" y="575" font-size="12" fill="#ff6b6b" text-anchor="middle">O(n²) time complexity (too many comparisons)</text>
  <text x="600" y="600" font-size="12" fill="#ff6b6b" text-anchor="middle">O(n) space complexity (too many stack frames)</text>
  <text x="600" y="630" font-size="12" fill="#51cf66" text-anchor="middle">Fix pivot selection → both symptoms disappear simultaneously</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#51cf66"/>
    </marker>
  </defs>
</svg>