<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="560" fill="#0e1b2f"/>

  <text x="600" y="48" font-size="26" font-weight="bold" fill="#e8eef7" text-anchor="middle">Same tottime, Two Different Diagnoses</text>

  <!-- shared origin -->
  <circle cx="600" cy="110" r="22" fill="#3d5a80" stroke="#7dd3fc" stroke-width="2"/>
  <text x="600" y="116" font-size="12" font-weight="bold" fill="white" text-anchor="middle">9.0s</text>

  <line x1="580" y1="128" x2="330" y2="200" stroke="#7dd3fc" stroke-width="2"/>
  <line x1="620" y1="128" x2="870" y2="200" stroke="#7dd3fc" stroke-width="2"/>

  <!-- Left: efficiency problem -->
  <text x="330" y="235" font-size="16" font-weight="bold" fill="#ff8787" text-anchor="middle">Efficiency Problem</text>
  <rect x="230" y="260" width="200" height="90" rx="6" fill="#7a3b3b" stroke="#ffb3b3" stroke-width="2"/>
  <text x="330" y="450" font-size="13" fill="#a8b8d8" text-anchor="middle">1 expensive call</text>
  <text x="330" y="470" font-size="12" fill="#7d93b8" text-anchor="middle">fix: rewrite the algorithm</text>

  <!-- Right: frequency problem -->
  <text x="870" y="235" font-size="16" font-weight="bold" fill="#51cf66" text-anchor="middle">Frequency Problem</text>
  <g fill="#2f7d4f" stroke="#a3e9a4" stroke-width="1.5">
    <rect x="720" y="270" width="16" height="16" rx="2"/>
    <rect x="745" y="270" width="16" height="16" rx="2"/>
    <rect x="770" y="270" width="16" height="16" rx="2"/>
    <rect x="795" y="270" width="16" height="16" rx="2"/>
    <rect x="820" y="270" width="16" height="16" rx="2"/>
    <rect x="845" y="270" width="16" height="16" rx="2"/>
    <rect x="870" y="270" width="16" height="16" rx="2"/>
    <rect x="895" y="270" width="16" height="16" rx="2"/>
    <rect x="920" y="270" width="16" height="16" rx="2"/>
    <rect x="945" y="270" width="16" height="16" rx="2"/>
    <rect x="720" y="296" width="16" height="16" rx="2"/>
    <rect x="745" y="296" width="16" height="16" rx="2"/>
    <rect x="770" y="296" width="16" height="16" rx="2"/>
    <rect x="795" y="296" width="16" height="16" rx="2"/>
    <rect x="820" y="296" width="16" height="16" rx="2"/>
    <rect x="845" y="296" width="16" height="16" rx="2"/>
    <rect x="870" y="296" width="16" height="16" rx="2"/>
    <rect x="895" y="296" width="16" height="16" rx="2"/>
    <rect x="920" y="296" width="16" height="16" rx="2"/>
    <rect x="945" y="296" width="16" height="16" rx="2"/>
    <rect x="720" y="322" width="16" height="16" rx="2"/>
    <rect x="745" y="322" width="16" height="16" rx="2"/>
    <rect x="770" y="322" width="16" height="16" rx="2"/>
    <rect x="795" y="322" width="16" height="16" rx="2"/>
    <rect x="820" y="322" width="16" height="16" rx="2"/>
    <rect x="845" y="322" width="16" height="16" rx="2"/>
    <rect x="870" y="322" width="16" height="16" rx="2"/>
    <rect x="895" y="322" width="16" height="16" rx="2"/>
    <rect x="920" y="322" width="16" height="16" rx="2"/>
    <rect x="945" y="322" width="16" height="16" rx="2"/>
  </g>
  <text x="870" y="450" font-size="13" fill="#a8b8d8" text-anchor="middle">1,000,000 cheap calls</text>
  <text x="870" y="470" font-size="12" fill="#7d93b8" text-anchor="middle">fix: reduce how often it's called</text>

  <rect x="150" y="500" width="900" height="34" fill="#1a2a47" stroke="#3d5a80" stroke-width="1" rx="4"/>
  <text x="600" y="522" font-size="12" fill="#7dd3fc" text-anchor="middle">tottime alone can't tell these apart. ncalls is what splits the diagnosis.</text>
</svg>
