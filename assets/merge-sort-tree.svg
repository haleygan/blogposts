<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node-circle { fill: #4da6ff; }
      .node-text { fill: white; font-size: 12px; font-family: monospace; text-anchor: middle; }
      .level-label { fill: #b3d9ff; font-size: 11px; font-family: monospace; }
      .ops-label { fill: #99cc99; font-size: 11px; font-family: monospace; font-weight: bold; }
      .line { stroke: #666666; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0e1b2f"/>

  <!-- Title -->
  <text x="400" y="25" style="font-size: 16px; font-family: sans-serif; fill: #e6e6e6; text-anchor: middle; font-weight: bold;">Merge Sort Recursion Tree (n=8)</text>

  <!-- Level 0 -->
  <text x="20" y="80" class="level-label">Level 0:</text>
  <circle cx="400" cy="80" r="20" class="node-circle"/>
  <text x="400" y="85" class="node-text">[8]</text>
  <text x="750" y="85" class="ops-label">0 ops</text>

  <!-- Level 1 -->
  <text x="20" y="150" class="level-label">Level 1:</text>
  <line x1="400" y1="100" x2="250" y2="130" class="line"/>
  <line x1="400" y1="100" x2="550" y2="130" class="line"/>
  <circle cx="250" cy="150" r="18" class="node-circle"/>
  <circle cx="550" cy="150" r="18" class="node-circle"/>
  <text x="250" y="155" class="node-text">[4]</text>
  <text x="550" y="155" class="node-text">[4]</text>
  <text x="750" y="155" class="ops-label">8 ops merge</text>

  <!-- Level 2 -->
  <text x="20" y="220" class="level-label">Level 2:</text>
  <line x1="250" y1="168" x2="170" y2="200" class="line"/>
  <line x1="250" y1="168" x2="310" y2="200" class="line"/>
  <line x1="550" y1="168" x2="490" y2="200" class="line"/>
  <line x1="550" y1="168" x2="630" y2="200" class="line"/>
  <circle cx="170" cy="220" r="16" class="node-circle"/>
  <circle cx="310" cy="220" r="16" class="node-circle"/>
  <circle cx="490" cy="220" r="16" class="node-circle"/>
  <circle cx="630" cy="220" r="16" class="node-circle"/>
  <text x="170" y="224" class="node-text">[2]</text>
  <text x="310" y="224" class="node-text">[2]</text>
  <text x="490" y="224" class="node-text">[2]</text>
  <text x="630" y="224" class="node-text">[2]</text>
  <text x="750" y="225" class="ops-label">8 ops merge</text>

  <!-- Level 3 -->
  <text x="20" y="290" class="level-label">Level 3:</text>
  <line x1="170" y1="236" x2="145" y2="265" class="line"/>
  <line x1="170" y1="236" x2="195" y2="265" class="line"/>
  <line x1="310" y1="236" x2="285" y2="265" class="line"/>
  <line x1="310" y1="236" x2="335" y2="265" class="line"/>
  <line x1="490" y1="236" x2="465" y2="265" class="line"/>
  <line x1="490" y1="236" x2="515" y2="265" class="line"/>
  <line x1="630" y1="236" x2="605" y2="265" class="line"/>
  <line x1="630" y1="236" x2="655" y2="265" class="line"/>

  <circle cx="145" cy="280" r="14" class="node-circle"/>
  <circle cx="195" cy="280" r="14" class="node-circle"/>
  <circle cx="285" cy="280" r="14" class="node-circle"/>
  <circle cx="335" cy="280" r="14" class="node-circle"/>
  <circle cx="465" cy="280" r="14" class="node-circle"/>
  <circle cx="515" cy="280" r="14" class="node-circle"/>
  <circle cx="605" cy="280" r="14" class="node-circle"/>
  <circle cx="655" cy="280" r="14" class="node-circle"/>

  <text x="145" y="283" class="node-text" style="font-size: 10px;">[1]</text>
  <text x="195" y="283" class="node-text" style="font-size: 10px;">[1]</text>
  <text x="285" y="283" class="node-text" style="font-size: 10px;">[1]</text>
  <text x="335" y="283" class="node-text" style="font-size: 10px;">[1]</text>
  <text x="465" y="283" class="node-text" style="font-size: 10px;">[1]</text>
  <text x="515" y="283" class="node-text" style="font-size: 10px;">[1]</text>
  <text x="605" y="283" class="node-text" style="font-size: 10px;">[1]</text>
  <text x="655" y="283" class="node-text" style="font-size: 10px;">[1]</text>

  <text x="750" y="285" class="ops-label">8 ops merge</text>

  <!-- Summary -->
  <rect x="50" y="340" width="700" height="240" fill="none" stroke="#4da6ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <text x="70" y="365" style="font-size: 13px; font-family: monospace; fill: #e6e6e6; font-weight: bold;">Analysis</text>

  <text x="70" y="390" style="font-size: 11px; font-family: monospace; fill: #b3d9ff;">Number of levels: log2(8) = 3</text>
  <text x="70" y="410" style="font-size: 11px; font-family: monospace; fill: #b3d9ff;">Work per level: 8 elements merged = 8 comparisons</text>
  <text x="70" y="430" style="font-size: 11px; font-family: monospace; fill: #b3d9ff;">Total work: 3 levels × 8 ops = 24 operations</text>

  <text x="70" y="455" style="font-size: 11px; font-family: monospace; fill: #99cc99;">Formula: n log n = 8 × 3 = 24 ✓</text>

  <text x="70" y="480" style="font-size: 11px; font-family: monospace; fill: #b3d9ff;">Key insight: Logarithmic depth, linear work per level</text>
  <text x="70" y="500" style="font-size: 11px; font-family: monospace; fill: #b3d9ff;">This structure repeats for any n: log(n) levels, O(n) per level</text>
  <text x="70" y="520" style="font-size: 11px; font-family: monospace; fill: #b3d9ff;">Depth is always log(n), so total is always O(n log n)</text>
</svg>