<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="560" fill="#0e1b2f"/>

  <text x="600" y="48" font-size="26" font-weight="bold" fill="#e8eef7" text-anchor="middle">n Doubles. Watch What Time Does.</text>

  <circle cx="150" cy="290" r="34" fill="#3d5a80" stroke="#7dd3fc" stroke-width="2"/>
  <text x="150" y="285" font-size="12" fill="white" text-anchor="middle">n</text>
  <text x="150" y="300" font-size="12" fill="white" text-anchor="middle">→2n</text>

  <line x1="184" y1="240" x2="380" y2="130" stroke="#7dd3fc" stroke-width="2"/>
  <line x1="184" y1="290" x2="380" y2="290" stroke="#7dd3fc" stroke-width="2"/>
  <line x1="184" y1="340" x2="380" y2="450" stroke="#7dd3fc" stroke-width="2"/>

  <!-- O(log n) barely moves -->
  <rect x="380" y="95" width="360" height="70" rx="8" fill="#16213a" stroke="#a3e9a4" stroke-width="2"/>
  <line x1="410" y1="135" x2="710" y2="127" stroke="#51cf66" stroke-width="4"/>
  <text x="760" y="135" font-size="14" fill="#a3e9a4" text-anchor="start">O(log n)</text>
  <text x="410" y="160" font-size="11" fill="#7d93b8">time barely moves</text>

  <!-- O(n) doubles -->
  <rect x="380" y="255" width="360" height="70" rx="8" fill="#16213a" stroke="#7dd3fc" stroke-width="2"/>
  <line x1="410" y1="315" x2="710" y2="270" stroke="#4dabf7" stroke-width="4"/>
  <text x="760" y="278" font-size="14" fill="#7dd3fc" text-anchor="start">O(n)</text>
  <text x="410" y="320" font-size="11" fill="#7d93b8">time doubles to match</text>

  <!-- O(n^2) quadruples -->
  <rect x="380" y="415" width="360" height="70" rx="8" fill="#16213a" stroke="#ff8787" stroke-width="2"/>
  <line x1="410" y1="478" x2="710" y2="425" stroke="#ff6b6b" stroke-width="4"/>
  <text x="760" y="433" font-size="14" fill="#ff8787" text-anchor="start">O(n²)</text>
  <text x="410" y="483" font-size="11" fill="#7d93b8">time quadruples</text>

  <rect x="820" y="95" width="330" height="390" fill="#1a2a47" stroke="#3d5a80" stroke-width="1" rx="6"/>
  <text x="985" y="135" font-size="13" fill="#a3e9a4" text-anchor="middle">log n: 1.0x - 1.1x</text>
  <text x="985" y="165" font-size="13" fill="#7dd3fc" text-anchor="middle">n: ~2.0x</text>
  <text x="985" y="195" font-size="13" fill="#c9a3ff" text-anchor="middle">n log n: ~2.1x - 2.2x</text>
  <text x="985" y="225" font-size="13" fill="#ff8787" text-anchor="middle">n²: ~4.0x</text>
  <text x="985" y="270" font-size="11" fill="#5d7ca8" text-anchor="middle">the ratio is the signal,</text>
  <text x="985" y="290" font-size="11" fill="#5d7ca8" text-anchor="middle">not the raw seconds</text>
</svg>
