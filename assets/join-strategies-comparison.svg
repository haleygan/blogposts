<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0e1b2f"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  
  <text x="640" y="70" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle">Join Strategy Complexity &amp; Hardware Trade-Offs</text>
  <text x="640" y="105" fill="#94a3b8" font-size="16" text-anchor="middle">How query planners choose between Nested Loop, Hash Join, Sort-Merge, and Index Nested Loop</text>

  <!-- 4 Strategy Cards in 2x2 grid -->
  <!-- 1. Nested Loop -->
  <rect x="80" y="140" width="520" height="235" rx="14" fill="#13233b" stroke="#ef4444" stroke-width="1.5"/>
  <div class="header">
    <text x="110" y="175" fill="#f87171" font-size="17" font-weight="700">Nested Loop Join — O(n × m)</text>
    <text x="570" y="175" fill="#f87171" font-size="13" font-weight="700" text-anchor="end">5,000,000,000 ops</text>
  </div>
  <text x="110" y="205" fill="#cbd5e1" font-size="13">Mechanism: For every row in table A (n), scan all rows in table B (m).</text>
  <text x="110" y="230" fill="#94a3b8" font-size="12">Memory: O(1) auxiliary space (pure streaming without buffers).</text>
  <rect x="110" y="250" width="460" height="105" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="130" y="280" fill="#f87171" font-size="12" font-weight="600">When it wins:</text>
  <text x="130" y="302" fill="#cbd5e1" font-size="12">Outer table has only 1-5 rows after WHERE filtering.</text>
  <text x="130" y="325" fill="#fca5a5" font-size="12">Catastrophic when both tables have &gt; 1,000 rows.</text>

  <!-- 2. Hash Join -->
  <rect x="680" y="140" width="520" height="235" rx="14" fill="#13233b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="710" y="175" fill="#38bdf8" font-size="17" font-weight="700">Hash Join — O(n + m)</text>
  <text x="1170" y="175" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="end">10,000,500 ops</text>
  <text x="710" y="205" fill="#cbd5e1" font-size="13">Mechanism: Build hash table on small table (m), probe with large table (n).</text>
  <text x="710" y="230" fill="#94a3b8" font-size="12">Memory: O(m) auxiliary space (small table must fit in RAM).</text>
  <rect x="710" y="250" width="460" height="105" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="730" y="280" fill="#38bdf8" font-size="12" font-weight="600">When it wins:</text>
  <text x="730" y="302" fill="#cbd5e1" font-size="12">High-cardinality join key and build side fits comfortably in RAM.</text>
  <text x="730" y="325" fill="#bae6fd" font-size="12">Default go-to strategy for analytical data warehouses.</text>

  <!-- 3. Sort-Merge -->
  <rect x="80" y="405" width="520" height="255" rx="14" fill="#13233b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="110" y="440" fill="#a78bfa" font-size="17" font-weight="700">Sort-Merge Join — O(n log n + m log m)</text>
  <text x="570" y="440" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="end">~50,001,349 ops</text>
  <text x="110" y="470" fill="#cbd5e1" font-size="13">Mechanism: Sort both sides on join key, then walk dual pointers forward.</text>
  <text x="110" y="495" fill="#94a3b8" font-size="12">Memory: Spills gracefully to disk chunks; does not require full table in RAM.</text>
  <rect x="110" y="515" width="460" height="120" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="130" y="545" fill="#a78bfa" font-size="12" font-weight="600">When it wins:</text>
  <text x="130" y="567" fill="#cbd5e1" font-size="12">Tables already sorted, massive memory pressure, or severe key skew.</text>
  <text x="130" y="590" fill="#cbd5e1" font-size="12">Never degrades to quadratic time under duplicate collision chains.</text>

  <!-- 4. Index Nested Loop -->
  <rect x="680" y="405" width="520" height="255" rx="14" fill="#13233b" stroke="#34d399" stroke-width="1.5"/>
  <text x="710" y="440" fill="#34d399" font-size="17" font-weight="700">Index Nested Loop Join — O(n log m)</text>
  <text x="1170" y="440" fill="#34d399" font-size="13" font-weight="700" text-anchor="end">~90,000,000 ops</text>
  <text x="710" y="470" fill="#cbd5e1" font-size="13">Mechanism: Scan outer table (n), lookup inner via pre-existing B-Tree index.</text>
  <text x="710" y="495" fill="#94a3b8" font-size="12">Memory: O(1) auxiliary space (index already persists on disk/cache).</text>
  <rect x="710" y="515" width="460" height="120" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="730" y="545" fill="#34d399" font-size="12" font-weight="600">When it wins:</text>
  <text x="730" y="567" fill="#cbd5e1" font-size="12">Outer table has moderate filtered rows and inner table has a B-Tree.</text>
  <text x="730" y="590" fill="#cbd5e1" font-size="12">Avoids O(m) hash table setup cost entirely.</text>

</svg>