<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0e1b2f"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  
  <text x="640" y="70" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle">O(n) Time vs Auxiliary Memory Footprint</text>
  <text x="640" y="105" fill="#94a3b8" font-size="16" text-anchor="middle">Both processes touch all n records, but memory usage scales in completely opposite directions</text>

  <!-- Left Side: Streaming O(1) space -->
  <rect x="80" y="145" width="520" height="520" rx="16" fill="#13233b" stroke="#334155" stroke-width="2"/>
  <text x="110" y="190" fill="#34d399" font-size="18" font-weight="700">1. Pure Streaming: O(1) Auxiliary Space</text>
  <text x="110" y="218" fill="#94a3b8" font-size="14">Sum, Count, Filter Generators, Running Max</text>

  <!-- Visual Stream Pipe -->
  <rect x="110" y="245" width="460" height="160" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
  <text x="130" y="275" fill="#34d399" font-size="13" font-weight="bold">Continuous Stream Through 1 Single Integer Variable:</text>

  <!-- Pipe Flow -->
  <g transform="translate(130, 295)">
    <rect x="0" y="10" width="80" height="40" rx="6" fill="#1e293b" stroke="#334155"/><text x="40" y="35" fill="#cbd5e1" font-size="12" text-anchor="middle">Event 1</text>
    <path d="M 85 30 L 115 30" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <rect x="120" y="10" width="80" height="40" rx="6" fill="#1e293b" stroke="#334155"/><text x="160" y="35" fill="#cbd5e1" font-size="12" text-anchor="middle">Event 2</text>
    <path d="M 205 30 L 235 30" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <rect x="240" y="0" width="100" height="60" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="290" y="28" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">total += amt</text>
    <text x="290" y="48" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">(Overwrites)</text>
  </g>
  <text x="130" y="385" fill="#94a3b8" font-size="12">Only 1 object kept in heap memory at any point in time.</text>

  <rect x="110" y="425" width="460" height="210" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="130" y="460" fill="#34d399" font-size="15" font-weight="700">Memory Guarantee:</text>
  <text x="130" y="490" fill="#cbd5e1" font-size="13">• n = 1,000 records → 8 bytes RAM</text>
  <text x="130" y="520" fill="#cbd5e1" font-size="13">• n = 10,000,000 records → 8 bytes RAM</text>
  <text x="130" y="550" fill="#cbd5e1" font-size="13">• n = 1,000,000,000 records → 8 bytes RAM</text>
  <text x="130" y="590" fill="#34d399" font-size="13" font-weight="600">Zero OOM risk regardless of stream lifetime.</text>

  <!-- Right Side: Accumulation O(n) space -->
  <rect x="680" y="145" width="520" height="520" rx="16" fill="#13233b" stroke="#334155" stroke-width="2"/>
  <text x="710" y="190" fill="#f87171" font-size="18" font-weight="700">2. In-Memory State: O(n) Auxiliary Space</text>
  <text x="710" y="218" fill="#94a3b8" font-size="14">Deduplication Set, Distinct Count, Materialized List</text>

  <!-- Visual Memory Growth -->
  <rect x="710" y="245" width="460" height="160" rx="12" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
  <text x="730" y="275" fill="#f87171" font-size="13" font-weight="bold">Heap Memory Accumulation Over Time:</text>

  <g transform="translate(730, 295)">
    <rect x="0" y="20" width="70" height="30" rx="4" fill="#1e293b" stroke="#475569"/><text x="35" y="40" fill="#cbd5e1" font-size="11" text-anchor="middle">100MB</text>
    <rect x="80" y="12" width="75" height="38" rx="4" fill="#334155" stroke="#64748b"/><text x="117" y="37" fill="#ffffff" font-size="11" text-anchor="middle">1.2GB</text>
    <rect x="165" y="5" width="85" height="45" rx="4" fill="#991b1b" stroke="#ef4444"/><text x="207" y="33" fill="#ffffff" font-size="11" text-anchor="middle">8.5GB</text>
    <rect x="260" y="0" width="160" height="50" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="340" y="30" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">16GB → OOM KILL</text>
  </g>
  <text x="730" y="385" fill="#f87171" font-size="12">Remembers all seen IDs. Process killed after hours under production scale.</text>

  <rect x="710" y="425" width="460" height="210" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="730" y="460" fill="#f87171" font-size="15" font-weight="700">Memory Failure Trajectory:</text>
  <text x="730" y="490" fill="#cbd5e1" font-size="13">• n = 1,000 records → passes local unit tests</text>
  <text x="730" y="520" fill="#cbd5e1" font-size="13">• n = 10,000,000 records → degrades container performance</text>
  <text x="730" y="550" fill="#cbd5e1" font-size="13">• n = 500,000,000 records → container crash at 2am</text>
  <text x="730" y="590" fill="#f87171" font-size="13" font-weight="600">Fix: Use streaming generators or Redis with TTL.</text>

</svg>