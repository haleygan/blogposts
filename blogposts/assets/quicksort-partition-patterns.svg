<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="600" fill="#0e1b2f"/>

  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" fill="#e8eef7" text-anchor="middle">Partition Tree Patterns: Degenerate vs Balanced Splits</text>

  <!-- Left side: Degenerate (sorted data, naive pivot) -->
  <text x="250" y="90" font-size="18" font-weight="bold" fill="#ff6b6b" text-anchor="middle">Naive Pivot on Sorted Data</text>
  <text x="250" y="115" font-size="14" fill="#a8b8d8" text-anchor="middle">O(n²) worst case</text>

  <!-- Degenerate tree -->
  <circle cx="250" cy="150" r="20" fill="#ff6b6b" stroke="#ffb3b3" stroke-width="2"/>
  <text x="250" y="157" font-size="12" font-weight="bold" fill="white" text-anchor="middle">5</text>

  <line x1="250" y1="170" x2="250" y2="200" stroke="#ff9999" stroke-width="2"/>
  <circle cx="250" cy="220" r="18" fill="#ff8787" stroke="#ffb3b3" stroke-width="2"/>
  <text x="250" y="226" font-size="11" font-weight="bold" fill="white" text-anchor="middle">4</text>

  <line x1="250" y1="238" x2="250" y2="268" stroke="#ff9999" stroke-width="2"/>
  <circle cx="250" cy="288" r="16" fill="#ff9999" stroke="#ffb3b3" stroke-width="2"/>
  <text x="250" y="293" font-size="10" font-weight="bold" fill="white" text-anchor="middle">3</text>

  <line x1="250" y1="304" x2="250" y2="334" stroke="#ff9999" stroke-width="2"/>
  <circle cx="250" cy="354" r="14" fill="#ffaaaa" stroke="#ffb3b3" stroke-width="2"/>
  <text x="250" y="359" font-size="10" font-weight="bold" fill="white" text-anchor="middle">2</text>

  <line x1="250" y1="368" x2="250" y2="398" stroke="#ff9999" stroke-width="2"/>
  <circle cx="250" cy="418" r="12" fill="#ffb8b8" stroke="#ffb3b3" stroke-width="2"/>
  <text x="250" y="423" font-size="9" font-weight="bold" fill="white" text-anchor="middle">1</text>

  <text x="250" y="490" font-size="13" fill="#e8eef7" text-anchor="middle" font-weight="bold">Staircase Pattern</text>
  <text x="250" y="510" font-size="12" fill="#a8b8d8" text-anchor="middle">Depth: n</text>
  <text x="250" y="530" font-size="12" fill="#a8b8d8" text-anchor="middle">Comparisons: n(n-1)/2</text>

  <!-- Right side: Balanced (random data, good pivot) -->
  <text x="950" y="90" font-size="18" font-weight="bold" fill="#51cf66" text-anchor="middle">Random Pivot on Random Data</text>
  <text x="950" y="115" font-size="14" fill="#a8b8d8" text-anchor="middle">O(n log n) average case</text>

  <!-- Balanced tree -->
  <circle cx="950" cy="150" r="20" fill="#51cf66" stroke="#a3e9a4" stroke-width="2"/>
  <text x="950" y="157" font-size="12" font-weight="bold" fill="white" text-anchor="middle">3</text>

  <!-- Level 2 -->
  <line x1="950" y1="170" x2="850" y2="200" stroke="#7ddfc4" stroke-width="2"/>
  <line x1="950" y1="170" x2="1050" y2="200" stroke="#7ddfc4" stroke-width="2"/>

  <circle cx="850" cy="220" r="18" fill="#69db7c" stroke="#a3e9a4" stroke-width="2"/>
  <text x="850" y="226" font-size="11" font-weight="bold" fill="white" text-anchor="middle">1</text>

  <circle cx="1050" cy="220" r="18" fill="#69db7c" stroke="#a3e9a4" stroke-width="2"/>
  <text x="1050" y="226" font-size="11" font-weight="bold" fill="white" text-anchor="middle">4</text>

  <!-- Level 3 -->
  <line x1="850" y1="238" x2="800" y2="268" stroke="#7ddfc4" stroke-width="2"/>
  <line x1="850" y1="238" x2="900" y2="268" stroke="#7ddfc4" stroke-width="2"/>
  <line x1="1050" y1="238" x2="1000" y2="268" stroke="#7ddfc4" stroke-width="2"/>
  <line x1="1050" y1="238" x2="1100" y2="268" stroke="#7ddfc4" stroke-width="2"/>

  <circle cx="800" cy="288" r="14" fill="#7ee8b7" stroke="#a3e9a4" stroke-width="2"/>
  <circle cx="900" cy="288" r="14" fill="#7ee8b7" stroke="#a3e9a4" stroke-width="2"/>
  <circle cx="1000" cy="288" r="14" fill="#7ee8b7" stroke="#a3e9a4" stroke-width="2"/>
  <circle cx="1100" cy="288" r="14" fill="#7ee8b7" stroke="#a3e9a4" stroke-width="2"/>

  <text x="950" y="490" font-size="13" fill="#e8eef7" text-anchor="middle" font-weight="bold">Binary Tree Pattern</text>
  <text x="950" y="510" font-size="12" fill="#a8b8d8" text-anchor="middle">Depth: log n</text>
  <text x="950" y="530" font-size="12" fill="#a8b8d8" text-anchor="middle">Comparisons: n log n</text>

  <!-- Comparison note -->
  <rect x="80" y="560" width="1040" height="30" fill="#1a2a47" stroke="#3d5a80" stroke-width="1" rx="4"/>
  <text x="600" y="581" font-size="12" fill="#7dd3fc" text-anchor="middle">Both sort the same data. Left: O(n²) time. Right: O(n log n) time. Input order determines which path you take.</text>
</svg>